name: E2E Tests - OpenShift Deployment

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e-tests-openshift.yml'
  workflow_dispatch:
    inputs:
      frontend_url:
        description: 'OpenShift Frontend URL'
        required: true
      backend_url:
        description: 'OpenShift Backend URL'
        required: true

jobs:
  e2e-tests-openshift:
    name: Run E2E Tests Against OpenShift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against OpenShift deployment
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ github.event.inputs.frontend_url || secrets.OPENSHIFT_FRONTEND_URL }}
          API_URL: ${{ github.event.inputs.backend_url || secrets.OPENSHIFT_BACKEND_URL }}
          CI: true
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-openshift
          path: tests/e2e/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-openshift
          path: tests/e2e/test-results/
          retention-days: 30

      - name: Report test status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ E2E tests passed against OpenShift deployment"
          else
            echo "❌ E2E tests failed against OpenShift deployment"
            exit 1
          fi
